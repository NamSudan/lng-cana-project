<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B2530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ghi chú công việc — LNG Cà Ná</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F3EF; --surface:#FFFFFF; --surface-alt:#EAEBE6;
    --ink:#1D2226; --ink-muted:#5B6572; --ink-faint:#8A8F87;
    --steel:#2E6091; --steel-bg:#E7EEF4; --steel-dark:#1B2530;
    --red:#B23A3A; --red-bg:#FAEAEA;
    --green:#3C7F5B; --green-bg:#E8F2EC;
    --border:#DEDFD8; --radius:10px;
    --font-sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);line-height:1.5;min-height:100vh;min-height:100dvh;}
  header{background:var(--steel-dark);color:#F2F3EF;padding:18px 20px;}
  header .brand{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#9AA6B0;margin-bottom:4px;}
  header h1{font-size:17px;margin:0;font-weight:600;}
  main{max-width:480px;margin:0 auto;padding:20px 16px 40px;}

  .state{display:none;}
  .state.active{display:block;}

  .center-msg{text-align:center;padding:60px 16px;color:var(--ink-muted);font-size:14px;}
  .center-msg.err{color:var(--red);}

  .greeting{font-size:15px;color:var(--ink-muted);margin:4px 0 18px;}
  .greeting b{color:var(--ink);}

  label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-muted);margin:16px 0 6px;}
  select, textarea, input[type="date"]{
    width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius);
    font-family:var(--font-sans);font-size:15px;background:var(--surface);color:var(--ink);
  }
  textarea{min-height:100px;resize:vertical;}
  select:focus, textarea:focus, input:focus{outline:2px solid var(--steel);outline-offset:1px;}

  button.submit{
    width:100%;margin-top:22px;padding:14px;border:none;border-radius:var(--radius);
    background:var(--steel);color:#fff;font-family:var(--font-sans);font-size:15px;font-weight:600;cursor:pointer;
  }
  button.submit:disabled{opacity:.6;cursor:default;}
  button.submit:not(:disabled):active{background:var(--steel-dark);}

  .banner{border-radius:var(--radius);padding:12px 14px;font-size:13.5px;margin-top:14px;display:none;}
  .banner.show{display:block;}
  .banner.ok{background:var(--green-bg);color:var(--green);}
  .banner.err{background:var(--red-bg);color:var(--red);}

  .hint{font-size:12px;color:var(--ink-faint);margin-top:6px;}
  .mode-tabs{display:flex;background:var(--surface-alt);border-radius:var(--radius);padding:3px;margin:18px 0 4px;}
  .mode-tabs button{flex:1;border:none;background:transparent;padding:10px;border-radius:8px;font-family:var(--font-sans);font-size:14px;font-weight:600;color:var(--ink-muted);cursor:pointer;}
  .mode-tabs button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .only-note, .only-ev{display:none;}
  body.mode-note .only-note, body.mode-ev .only-ev{display:block;}
  .file-box{border:1px dashed var(--border);border-radius:var(--radius);background:var(--surface);padding:12px;}
  .file-box input{width:100%;font-size:14px;}
  .file-info{font-size:12.5px;color:var(--ink-muted);margin-top:6px;}
</style>
</head>
<body class="mode-note">

<header>
  <div class="brand">LNG Cà Ná</div>
  <h1>Ghi chú công việc</h1>
</header>

<main>
  <div class="state active" id="state-loading">
    <p class="center-msg">Đang tải...</p>
  </div>

  <div class="state" id="state-error">
    <p class="center-msg err" id="error-text">Link không hợp lệ.</p>
  </div>

  <div class="state" id="state-form">
    <p class="greeting">Xin chào, <b id="personnel-name"></b>. Chọn việc và ghi lại kết quả hôm nay.</p>

    <label for="f-ws">Phòng ban</label>
    <select id="f-ws" onchange="onWsChange()"></select>

    <div id="board-wrap">
      <label for="f-board">Dự án</label>
      <select id="f-board" onchange="onBoardChange()"></select>
    </div>

    <label for="f-task">Công việc</label>
    <select id="f-task" onchange="rememberPick()"></select>

    <div class="mode-tabs">
      <button id="tab-note" class="active" onclick="setMode('note')">Ghi chú</button>
      <button id="tab-ev" onclick="setMode('ev')">Nộp phiếu duyệt</button>
    </div>

    <label for="f-desc" id="desc-label">Kết quả cụ thể</label>
    <textarea id="f-desc" placeholder="Đã làm được gì hôm nay..."></textarea>

    <div class="only-ev">
      <label for="f-approver">Gửi tới người duyệt</label>
      <select id="f-approver"></select>

      <label for="f-file">File minh chứng (không bắt buộc, tối đa 20 MB)</label>
      <div class="file-box">
        <input type="file" id="f-file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.dwg,.zip,.txt,.csv,.mp4,.mov" onchange="onFileChange()">
        <div class="file-info" id="file-info">Chụp ảnh trực tiếp hoặc chọn file có sẵn.</div>
      </div>
    </div>

    <div class="only-note">
    <label for="f-due">Hạn hoàn tất (không bắt buộc)</label>
    <input type="date" id="f-due">

    <label for="f-status">Trạng thái</label>
    <select id="f-status">
      <option value="Chưa thực hiện">Chưa thực hiện</option>
      <option value="Đang thực hiện" selected>Đang thực hiện</option>
      <option value="Hoàn thành">Hoàn thành</option>
      <option value="Trễ hạn">Trễ hạn</option>
    </select>
    </div>

    <button class="submit" id="btn-submit" onclick="submitCurrent()">Gửi ghi chú</button>
    <div class="banner" id="banner"></div>
    <p class="hint" id="bottom-hint">Ghi chú sẽ lưu vào Nhật ký công việc của việc bạn chọn.</p>
  </div>
</main>

<script>
  const SUPABASE_URL = 'https://cpvqkhxoyvxnmytpelkz.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwdnFraHhveXZ4bm15dHBlbGt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1ODU1NjAsImV4cCI6MjEwMzE2MTU2MH0.c3hq1ZN79LlUQLYWrey3lLe49aZ9nBC5QO_GEPZlPw4';

  const params = new URLSearchParams(location.search);
  const token = params.get('t');

  function showState(name){
    document.querySelectorAll('.state').forEach(s=>s.classList.remove('active'));
    document.getElementById('state-'+name).classList.add('active');
  }

  async function callFn(name, opts){
    const res = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
      ...opts,
      headers: {
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'apikey': SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        ...(opts && opts.headers ? opts.headers : {})
      }
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || 'Có lỗi xảy ra');
    return data;
  }

  // ---- chọn Phòng ban → Dự án → Công việc; nhớ lựa chọn gần nhất trên máy ----
  let CTX = { workspaces: [] };
  const PICK_KEY = 'qlog_pick_' + (token || '');
  const AP_KEY = 'qlog_approver_' + (token || '');
  const MAX_FILE = 20 * 1024 * 1024;
  let MODE = 'note';
  function loadPick(){ try{ return JSON.parse(localStorage.getItem(PICK_KEY) || '{}'); }catch(e){ return {}; } }
  function rememberPick(){
    try{
      localStorage.setItem(PICK_KEY, JSON.stringify({
        ws: document.getElementById('f-ws').value,
        board: document.getElementById('f-board').value,
        task: document.getElementById('f-task').value
      }));
    }catch(e){}
  }
  const countTasks = ws => ws.boards.reduce((n,b)=>n+b.tasks.length, 0);
  const boardKey = b => b.id || '_none';
  function curWs(){ return CTX.workspaces.find(w=>w.id===document.getElementById('f-ws').value); }

  function renderTasks(board, preferTask){
    const sel = document.getElementById('f-task');
    if(!board || !board.tasks.length){
      sel.innerHTML = '<option value="">(chưa được gán việc ở đây)</option>';
      sel.disabled = true;
    } else {
      sel.disabled = false;
      sel.innerHTML = board.tasks.map(t=>
        `<option value="${t.id}">${t.code ? t.code+' · ' : ''}${escapeHtml(t.name)}</option>`).join('');
      if(preferTask && board.tasks.some(t=>t.id===preferTask)) sel.value = preferTask;
    }
  }
  function renderBoards(ws, preferBoard, preferTask){
    const wrap = document.getElementById('board-wrap');
    const sel = document.getElementById('f-board');
    const boards = ws ? ws.boards : [];
    // phòng ban không chia dự án → ẩn ô Dự án
    if(boards.length <= 1 && (!boards[0] || !boards[0].name)){
      wrap.style.display = 'none';
      sel.innerHTML = boards[0] ? `<option value="${boardKey(boards[0])}"></option>` : '';
      renderTasks(boards[0], preferTask);
      return;
    }
    wrap.style.display = '';
    sel.innerHTML = boards.map(b=>
      `<option value="${boardKey(b)}">${escapeHtml(b.name)}${b.tasks.length ? ' ('+b.tasks.length+')' : ' — chưa có việc'}</option>`).join('');
    let pick = boards.find(b=>boardKey(b)===preferBoard) || boards.find(b=>b.tasks.length) || boards[0];
    sel.value = boardKey(pick);
    renderTasks(pick, preferTask);
  }
  window.onWsChange = function(){ renderBoards(curWs()); rememberPick(); };
  window.onBoardChange = function(){
    const ws = curWs();
    renderTasks(ws && ws.boards.find(b=>boardKey(b)===document.getElementById('f-board').value));
    rememberPick();
  };

  window.setMode = function(m){
    MODE = m;
    document.body.className = 'mode-' + m;
    document.getElementById('tab-note').classList.toggle('active', m==='note');
    document.getElementById('tab-ev').classList.toggle('active', m==='ev');
    document.getElementById('desc-label').textContent = m==='ev' ? 'Ghi chú cho người duyệt' : 'Kết quả cụ thể';
    document.getElementById('f-desc').placeholder = m==='ev' ? 'Nội dung minh chứng, kết quả đã hoàn thành...' : 'Đã làm được gì hôm nay...';
    document.getElementById('btn-submit').textContent = m==='ev' ? 'Nộp phiếu duyệt' : 'Gửi ghi chú';
    document.getElementById('bottom-hint').textContent = m==='ev'
      ? 'Phiếu sẽ vào hàng chờ duyệt trên app và gửi email cho người duyệt.'
      : 'Ghi chú sẽ lưu vào Nhật ký công việc của việc bạn chọn.';
    document.getElementById('banner').className = 'banner';
  };
  window.onFileChange = function(){
    const f = document.getElementById('f-file').files[0];
    const info = document.getElementById('file-info');
    if(!f){ info.textContent = 'Chụp ảnh trực tiếp hoặc chọn file có sẵn.'; info.style.color=''; return; }
    const mb = (f.size/1024/1024).toFixed(2);
    if(f.size > MAX_FILE){ info.textContent = `${f.name} — ${mb} MB: vượt quá 20 MB`; info.style.color='var(--red)'; }
    else { info.textContent = `${f.name} — ${mb} MB`; info.style.color=''; }
  };
  window.submitCurrent = function(){ return MODE==='ev' ? submitEvidence() : submitLog(); };

  async function submitEvidence(){
    const taskId = document.getElementById('f-task').value;
    const approverId = document.getElementById('f-approver').value;
    const note = document.getElementById('f-desc').value.trim();
    const file = document.getElementById('f-file').files[0];
    if(!taskId){ showBanner('Chọn công việc trước.', 'err'); return; }
    if(!approverId){ showBanner('Chọn người duyệt.', 'err'); return; }
    if(!note && !file){ showBanner('Nhập ghi chú hoặc đính kèm file minh chứng.', 'err'); return; }
    if(file && file.size > MAX_FILE){ showBanner('File vượt quá 20 MB.', 'err'); return; }

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    try{
      let path = null;
      if(file){
        btn.textContent = 'Đang chuẩn bị tải file...';
        const sign = await callFn('quick-evidence', { method:'POST', body: JSON.stringify({
          action:'sign', token, taskId, fileName: file.name, fileSize: file.size }) });
        btn.textContent = 'Đang tải file lên...';
        const form = new FormData();
        form.append('cacheControl', '3600');
        form.append('', file);
        const up = await fetch(sign.uploadUrl, { method:'PUT', headers:{ 'x-upsert':'false' }, body: form });
        if(!up.ok){
          const j = await up.json().catch(()=>({}));
          throw new Error('Tải file lỗi: ' + (j.message || j.error || ('HTTP '+up.status)));
        }
        path = sign.path;
      }
      btn.textContent = 'Đang tạo phiếu...';
      const taskSel = document.getElementById('f-task');
      const taskCode = (taskSel.options[taskSel.selectedIndex]?.text || '').split(' · ')[0];
      const res = await callFn('quick-evidence', { method:'POST', body: JSON.stringify({
        action:'submit', token, taskId, approverId, note, path,
        fileName: file ? file.name : null, mime: file ? file.type : null, taskCode }) });

      try{ localStorage.setItem(AP_KEY, approverId); }catch(e){}
      rememberPick();
      showBanner(`Đã nộp phiếu tới ${res.approverName}.` +
        (res.emailSent ? ' Đã gửi email thông báo.' : ` Chưa gửi được email (${res.emailError || 'lỗi'}) — phiếu vẫn nằm trong hàng chờ duyệt.`),
        res.emailSent ? 'ok' : 'err');
      document.getElementById('f-desc').value = '';
      document.getElementById('f-file').value = '';
      onFileChange();
    }catch(e){
      showBanner(e.message || 'Nộp phiếu thất bại, thử lại.', 'err');
    }finally{
      btn.disabled = false;
      btn.textContent = 'Nộp phiếu duyệt';
    }
  }

  async function init(){
    if(!token){
      document.getElementById('error-text').textContent = 'Thiếu link cá nhân. Vào app chính, bấm "Lấy link ghi chú nhanh" để lấy link của bạn.';
      showState('error');
      return;
    }
    try{
      const data = await callFn(`quick-log-context?t=${encodeURIComponent(token)}`, { method: 'GET' });
      document.getElementById('personnel-name').textContent = data.personnelName || '';
      CTX.workspaces = data.workspaces || [];
      const apSel = document.getElementById('f-approver');
      apSel.innerHTML = (data.approvers || []).map(p=>
        `<option value="${p.id}">${escapeHtml(p.name)}${p.role ? ' — '+escapeHtml(p.role) : ''}</option>`).join('');
      const lastAp = localStorage.getItem(AP_KEY);
      if(lastAp && (data.approvers||[]).some(p=>p.id===lastAp)) apSel.value = lastAp;
      const wsSel = document.getElementById('f-ws');
      if(!CTX.workspaces.length){
        wsSel.innerHTML = '<option value="">(bạn chưa thuộc phòng ban nào)</option>';
        wsSel.disabled = true;
        renderBoards(null);
      } else {
        wsSel.innerHTML = CTX.workspaces.map(w=>
          `<option value="${w.id}">${escapeHtml(w.name)}${countTasks(w) ? ' ('+countTasks(w)+')' : ' — chưa có việc'}</option>`).join('');
        const pick = loadPick();
        const ws = CTX.workspaces.find(w=>w.id===pick.ws) || CTX.workspaces.find(w=>countTasks(w)) || CTX.workspaces[0];
        wsSel.value = ws.id;
        renderBoards(ws, pick.board, pick.task);
      }
      showState('form');
    }catch(e){
      document.getElementById('error-text').textContent = e.message || 'Link không hợp lệ hoặc đã bị thu hồi.';
      showState('error');
    }
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function showBanner(text, type){
    const b = document.getElementById('banner');
    b.textContent = text;
    b.className = 'banner show ' + type;
  }

  window.submitLog = async function(){
    const taskId = document.getElementById('f-task').value;
    const description = document.getElementById('f-desc').value.trim();
    if(!taskId){ showBanner('Chọn công việc trước.', 'err'); return; }
    if(!description){ showBanner('Nhập kết quả cụ thể trước.', 'err'); return; }

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'Đang gửi...';
    try{
      await callFn('quick-log-submit', {
        method: 'POST',
        body: JSON.stringify({
          token,
          taskId,
          description,
          dueDate: document.getElementById('f-due').value || null,
          status: document.getElementById('f-status').value
        })
      });
      const now = new Date();
      const hh = String(now.getHours()).padStart(2,'0');
      const mm = String(now.getMinutes()).padStart(2,'0');
      showBanner(`Đã lưu lúc ${hh}:${mm}.`, 'ok');
      rememberPick();
      document.getElementById('f-desc').value = '';
      document.getElementById('f-due').value = '';
    }catch(e){
      showBanner(e.message || 'Gửi thất bại, thử lại.', 'err');
    }finally{
      btn.disabled = false;
      btn.textContent = 'Gửi ghi chú';
    }
  };

  init();
</script>
</body>
</html>
